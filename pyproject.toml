[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proving-ground"
version = "0.1.0"
description = "Proving Ground: a gated model release template."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "pandera>=0.20",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "fastapi>=0.110",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "requests>=2.31",
]

[project.optional-dependencies]
claims = ["lightgbm>=4.3", "shap>=0.45", "pyarrow>=15"]
tracking = ["mlflow>=2.14"]
drift = ["evidently>=0.7"]
data = ["dvc>=3.50"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "playwright>=1.45"]

[project.scripts]
proving-ground = "proving_ground.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
proving_ground = ["viewer/templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]
markers = ["slow: slower end-to-end tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
# Deliberately permissive (spec: "mypy (permissive)"): Optional-heavy research code; these codes are not enforced yet.
disable_error_code = ["assignment", "union-attr", "index", "type-var", "operator", "arg-type", "var-annotated", "return-value", "import-untyped", "misc"]
