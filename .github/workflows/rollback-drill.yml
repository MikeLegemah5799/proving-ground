name: rollback-drill
# Promote, then roll back, on every PR that touches serving, registry, promotion or rollback code.
on:
  pull_request:
    paths: ["src/proving_ground/serving/**", "src/proving_ground/registry.py", "src/proving_ground/promote.py",
            "src/proving_ground/rollback.py", "src/proving_ground/audit.py", "tests/core/test_flow.py"]
  workflow_dispatch:
permissions: { contents: read }
jobs:
  drill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - name: "promote, rollback, idempotency, canary abort, audit chain"
        run: python -m pytest tests/core/test_flow.py tests/core/test_audit.py -q
