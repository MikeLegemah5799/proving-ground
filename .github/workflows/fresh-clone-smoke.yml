name: fresh-clone-smoke
on:
  push: { branches: [main] }
  workflow_dispatch:
  schedule: [{ cron: "0 6 * * 1" }]
permissions: { contents: read }
jobs:
  smoke:
    runs-on: ubuntu-latest
    container: python:3.12-slim
    steps:
      - run: apt-get update && apt-get install -y git make libgomp1
      - uses: actions/checkout@v4
      - name: "Follow the README (setup, then the shortened demo; offline, no secrets)"
        run: |
          make setup
          make demo-fast
          test -s reports/viewer/index.html
          make audit-verify
